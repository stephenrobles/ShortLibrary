<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A8E"/><stop offset="1" stop-color="#E8555C"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC775"/><stop offset="1" stop-color="#EBA044"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#72DB85"/><stop offset="1" stop-color="#3FB85A"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5CC8FF"/><stop offset="1" stop-color="#1D9FE8"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B087E0"/><stop offset="1" stop-color="#7F55B8"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2E5C"/><stop offset="1" stop-color="#14162F"/></linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7D3B8"/><stop offset="1" stop-color="#B38C62"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
    <clipPath id="mask"><rect width="1024" height="1024" rx="230" ry="230"/></clipPath>
  </defs>
  <g clip-path="url(#mask)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- lower layer: a second shelf slab offset downward, like the bottom rhombus of the Shortcuts glyph -->
    <g transform="translate(512 512) skewX(-24) scale(1,0.78) translate(-512 -512)">
      <rect x="150" y="900" width="724" height="54" rx="14" fill="url(#shelf)" opacity="0.55" filter="url(#shadow)"/>
    </g>
    <!-- upper layer: the books and their shelf, skewed as one block -->
    <g transform="translate(512 512) skewX(-24) scale(1,0.78) translate(-512 -512)">

    <g filter="url(#shadow)">
      <rect x="195" y="300" width="112" height="470" rx="18" fill="url(#red)"/>
      <rect x="321" y="250" width="124" height="520" rx="18" fill="url(#blue)"/>
      <rect x="459" y="330" width="104" height="440" rx="18" fill="url(#yellow)"/>
      <rect x="577" y="270" width="118" height="500" rx="18" fill="url(#green)"/>
      <rect x="709" y="290" width="120" height="480" rx="18" fill="url(#purple)"/>
    </g>
    <g fill="#FFFFFF" opacity="0.55">
      <rect x="219" y="342" width="64" height="10" rx="5"/><rect x="219" y="700" width="64" height="10" rx="5"/>
      <rect x="345" y="292" width="76" height="10" rx="5"/><rect x="345" y="700" width="76" height="10" rx="5"/>
      <rect x="483" y="372" width="56" height="10" rx="5"/><rect x="483" y="700" width="56" height="10" rx="5"/>
      <rect x="601" y="312" width="70" height="10" rx="5"/><rect x="601" y="700" width="70" height="10" rx="5"/>
      <rect x="733" y="332" width="72" height="10" rx="5"/><rect x="733" y="700" width="72" height="10" rx="5"/>
    </g>
      <rect x="150" y="770" width="724" height="54" rx="14" fill="url(#shelf)" filter="url(#shadow)"/>
      <rect x="150" y="770" width="724" height="12" rx="6" fill="#FFFFFF" opacity="0.35"/>
    </g>
  </g>
</svg>
